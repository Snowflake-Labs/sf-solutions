name: SQL Lint

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  sqruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for SQL files
        id: check
        run: |
          if find . -name "*.sql" | grep -q .; then
            echo "has_sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sql=false" >> "$GITHUB_OUTPUT"
            echo "No SQL files found — skipping lint"
          fi

      - name: Install uv
        if: steps.check.outputs.has_sql == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Run sqruff lint
        if: steps.check.outputs.has_sql == 'true'
        run: uv run sqruff lint . --format github-annotation-native
